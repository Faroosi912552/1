<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced ChatGPT Button</title>
  <style>
    :root {
      --bg-color: #09090b;
      --btn-bg: #18181b;
      --btn-border: rgba(255, 255, 255, 0.12);
      --accent-glow: rgba(16, 163, 127, 0.45); /* OpenAI Emerald */
      --accent-solid: #10a37f;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Wrapper to handle magnetic boundary */
    .magnetic-wrap {
      padding: 30px;
      display: inline-block;
    }

    .chatgpt-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-color);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 9999px;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1), 
                  border-color 0.3s ease, 
                  box-shadow 0.3s ease;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    /* Cursor-tracking radial spotlight */
    .chatgpt-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        120px circle at var(--x, 50%) var(--y, 50%),
        var(--accent-glow),
        transparent 80%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .chatgpt-btn:hover {
      border-color: rgba(16, 163, 127, 0.6);
      box-shadow: 0 15px 35px -10px rgba(16, 163, 127, 0.25);
    }

    .chatgpt-btn:hover::before {
      opacity: 1;
    }

    .chatgpt-btn:active {
      transform: scale(0.96) !important;
    }

    /* Icon & Text Styling */
    .btn-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gpt-logo {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chatgpt-btn:hover .gpt-logo {
      transform: rotate(90deg);
      color: var(--accent-solid);
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      transition: transform 0.3s ease;
    }

    .chatgpt-btn:hover .arrow-icon {
      transform: translate(3px, -3px);
    }

    /* Loading State Animation */
    .chatgpt-btn.is-redirecting .gpt-logo {
      animation: spin 1s linear infinite;
      color: var(--accent-solid);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="magnetic-wrap" id="magneticWrap">
    <a href="https://chatgpt.com" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="chatgpt-btn" 
       id="chatgptBtn"
       aria-label="Open ChatGPT in a new tab">
